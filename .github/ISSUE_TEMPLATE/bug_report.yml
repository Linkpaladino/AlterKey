name: Bug report
description: Report a reproducible AlterKey problem.
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Select...
        2. Press...
        3. Open...
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Owlbear role
      options:
        - GM
        - PLAYER
    validations:
      required: true
  - type: input
    attributes:
      label: Browser and device
      placeholder: Chrome 153 on Windows 11
    validations:
      required: true
